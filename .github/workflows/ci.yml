# The gate CLAUDE.md describes, run by a machine on every pull request.
#
# It is the same commands a person runs by hand: lint, build, the Vitest suite,
# the Playwright smoke suite and the pgTAP database suites. The database ones
# used to be missing, because seeding them meant dumping the linked Supabase
# project and a public repository's CI cannot hold a credential for production.
# `supabase/baseline/` removed that reason: the schema is now the repository's
# to state, so a plain PostgreSQL can be built into it and tested.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push answers the question the first run was asking, so let it go.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The action majors below are the ones that run on Node 24. That is a separate
# Node from the one .nvmrc installs: an action's major decides the runtime
# GitHub executes the action's *own* code on, so a v4 action was still a node20
# action while every step in it ran Node 24. GitHub removes Node 20 from the
# runners on 23 September 2026, which turns that from a warning into a failure.
# Bumping one major is not always enough to clear it -- upload-artifact stayed
# on node20 through v5 -- so check `runs.using` rather than counting majors.

jobs:
  # Playwright is most of a run's wall time and has nothing to say about a
  # change that is only prose, so a pull request touching nothing but Markdown
  # skips it. A skipped job reports as passing, which keeps it usable as a
  # required check where a workflow-level path filter would leave it pending
  # forever. CLAUDE.md is not prose for this purpose: it carries the Playwright
  # count, and this suite is the only job that holds that number to a run.
  # Everything else still runs on every change, and main always runs it all.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          markdown_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            if [ -n "$files" ]; then
              markdown_only=true
              while IFS= read -r file; do
                case "$file" in
                  CLAUDE.md) markdown_only=false ;;
                  *.md) ;;
                  *) markdown_only=false ;;
                esac
              done <<< "$files"
            fi
            printf 'Changed files:\n%s\n' "$files"
          fi
          echo "markdown_only=$markdown_only"
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .nvmrc rather than a version written here, so the pin has one home.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vercel builds every pull request too, but with the project's real
      # environment. This one builds with none, which is the only way to catch a
      # build that has quietly come to depend on one -- and it answers in
      # seconds, before a deploy has started.
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No Supabase variables: vite.config.js pins unreachable ones for tests.
      - run: npm run test:run
      - name: Check the counts in CLAUDE.md
        run: npm run test:counts -- vitest

  e2e:
    name: Playwright
    needs: changes
    if: needs.changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser the installed Playwright actually pins. Getting that right
      # is most of why this suite is worth running here: a machine with the
      # matching build reports the app, and one without reports the mismatch.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check the counts in CLAUDE.md
        run: npm run test:counts -- playwright
      # Only on a failure, and only for a week: the trace and video are large
      # and are worth nothing once the run is understood.
      - name: Keep the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # No `npm ci` in this job: the count check is a dependency-free script
          # and the suites are SQL. Node is here only to run it.
          node-version-file: .nvmrc
      # The unversioned metapackage, so this keeps working when the runner image
      # moves to a new default PostgreSQL. It pulls the extension for whichever
      # version is installed, plus pg_prove.
      - name: Install pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pgtap
      # A local cluster that exists for the length of this job, reachable only
      # from the runner. The password is a connection detail, not a secret.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          until pg_isready --quiet; do sleep 1; done
          sudo -u postgres psql -c "alter role postgres password 'postgres'"
      - run: ./scripts/pgtap.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Check the counts in CLAUDE.md
        run: npm run test:counts -- pgtap
